
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101a30">
  <title>Create Account | VANTAGE X COMMUNITY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #101a30;
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
    }
    .card {
      background: #fff;
      color: #101a30;
      width: 100%;
      max-width: 440px;
      padding: 35px;
      border-radius: 14px;
    }
    .brand {
      text-align: center;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .brand span { color: #bd9145; }
    .subtitle {
      text-align: center;
      color: #687386;
      font-size: 14px;
      margin-bottom: 27px;
    }
    h1 { text-align: center; font-size: 25px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; font-weight: bold; margin: 15px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8dce4;
      border-radius: 6px;
      font-size: 15px;
    }
    input:focus { outline: 2px solid #d6ad61; border-color: transparent; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 23px;
      background: #d6ad61;
      color: #101a30;
      border: 0;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .notice {
      margin-top: 18px;
      background: #f5f2eb;
      color: #606b7d;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }
    .footer { text-align: center; margin-top: 22px; font-size: 14px; }
    .footer a { color: #9b742f; font-weight: bold; }
    .back { display: block; text-align: center; margin-top: 20px; color: #687386; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">VANTAGE X <span>COMMUNITY</span></div>
    <p class="subtitle">Building Connections. Creating Opportunities.</p>

    <h1>Create your account</h1>

    <form id="signup-form">
      <label for="fullname">Full name</label>
      <input id="fullname" type="text" placeholder="Enter your full name" autocomplete="name" required>

      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Choose a username" autocomplete="username" pattern="[A-Za-z0-9_]{3,30}" minlength="3" maxlength="30" required>

      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="Enter your email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>

      <button type="submit">Create Account</button>
    </form>

    <div class="notice">
      Registration is being prepared. Account creation will be activated after secure Supabase integration.
    </div>

    <p class="footer">Already a member? <a href="login.html">Log in</a></p>
    <a class="back" href="index.html">← Back to Community homepage</a>
  </main>

  <script>
    document.getElementById("signup-form").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Registration is not activated yet. Please check back soon.");
    });
  </script>
</body>
</html>
