
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Details | VANTAGE X GROUP LTD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy:#091725;
  --navy2:#142d40;
  --gold:#c6a15b;
  --ivory:#f7f5f0;
  --white:#ffffff;
  --text:#263746;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:'DM Sans',sans-serif;
  background:var(--ivory);
  color:var(--text);
  line-height:1.7;
}

header {
  background:var(--navy);
  color:white;
  padding:22px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.logo {
  color:var(--gold);
  font-weight:700;
  letter-spacing:1px;
  text-decoration:none;
}

.back-link {
  color:white;
  text-decoration:none;
  font-size:14px;
}

main {
  max-width:1100px;
  margin:55px auto;
  padding:0 22px;
}

.eyebrow {
  color:#a9823e;
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  margin-bottom:12px;
}

h1,h2 {
  font-family:'Playfair Display',serif;
  color:var(--navy);
}

h1 {
  font-size:clamp(30px,5vw,48px);
  line-height:1.2;
  margin-bottom:15px;
}

.hero-image {
  width:100%;
  max-height:550px;
  object-fit:cover;
  border-radius:10px;
  margin:25px 0;
  background:#ddd;
}

.details {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin:25px 0;
}

.detail-card {
  background:white;
  padding:18px;
  border-radius:8px;
  border:1px solid #e8e3d9;
}

.detail-card small {
  display:block;
  color:#777;
  margin-bottom:5px;
}

.detail-card strong {
  color:var(--navy);
}

.description {
  background:white;
  padding:28px;
  border-radius:9px;
  margin:30px 0;
}

.description h2 {
  margin-bottom:12px;
}

.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin:20px 0 35px;
}

.gallery img {
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:8px;
  background:#ddd;
  cursor:pointer;
  transition:transform 0.3s ease;
}

.gallery img:hover {
  transform:scale(1.02);
}

.image-viewer {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:9999;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.image-viewer.active {
  display:flex;
}

.image-viewer img {
  max-width:95%;
  max-height:85vh;
  object-fit:contain;
  border-radius:6px;
}

.image-viewer button {
  position:absolute;
  top:20px;
  right:20px;
  background:#c6a15b;
  color:#091725;
  border:none;
  padding:12px 18px;
  font-size:20px;
  cursor:pointer;
  border-radius:4px;
}

.btn {
  display:inline-block;
  padding:14px 24px;
  background:var(--gold);
  color:var(--navy);
  font-weight:700;
  text-decoration:none;
  border-radius:4px;
  margin:10px 0;
}

.message {
  background:white;
  padding:30px;
  border-radius:8px;
  text-align:center;
}

footer {
  background:var(--navy);
  color:white;
  text-align:center;
  padding:35px 15px;
  margin-top:70px;
  font-size:13px;
}

footer strong {
  color:var(--gold);
}

</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">
    VANTAGE X GROUP LTD
  </a>

  <a href="index.html#live-projects" class="back-link">
    ← Back to Projects
  </a>
</header>

<main>

  <div id="projectContent" class="message">
    Loading project details...
  </div>

</main>

<!-- FULL SCREEN IMAGE VIEWER -->
<div class="image-viewer" id="imageViewer">

  <button type="button" id="closeImageViewer">
    ✕ CLOSE
  </button>

  <img id="expandedImage" src="" alt="Expanded project image">

</div>

<footer>
  <strong>VANTAGE X GROUP LTD</strong>
  <p>Building Value. Creating Opportunities.</p>
  <p>Kano State, Nigeria.</p>
  <p>© 2026 VANTAGE X GROUP LTD</p>
</footer>

<script>
"use strict";

const SUPABASE_URL =
  "https://hwpxxbscoscumkmoqjgs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AO9n1jSq-xCpG21VhpzWkQ_n4zNpMuv";

const content = document.getElementById("projectContent");

function addText(parent, tag, value) {
  const element = document.createElement(tag);
  element.textContent = value || "";
  parent.appendChild(element);
  return element;
}

async function loadProjectDetails() {

  const projectId =
    new URLSearchParams(window.location.search).get("id");

  if (!projectId) {
    content.textContent = "No project was selected.";
    return;
  }

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/projects?id=eq." +
      encodeURIComponent(projectId) +
      "&is_published=eq.true&select=*";

    const response = await fetch(url, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    });

    if (!response.ok) {
      throw new Error("Unable to load project.");
    }

    const projects = await response.json();

    if (!projects.length) {
      content.textContent =
        "This project is unavailable or has not been published.";
      return;
    }

    const project = projects[0];

    content.innerHTML = "";

    addText(content, "p", "VANTAGE X PROJECT PORTFOLIO")
      .className = "eyebrow";

    addText(content, "h1", project.project_name);

    const cover = document.createElement("img");
    cover.className = "hero-image";
    cover.alt = project.project_name;

    if (project.cover_image) {
      cover.src = project.cover_image;
    } else {
      cover.style.display = "none";
    }

    content.appendChild(cover);

    const details = document.createElement("div");
    details.className = "details";

    const fields = [
      ["Location", project.location],
      ["Category", project.category],
      ["Status", project.status],
      ["Price", project.price]
    ];

    fields.forEach(function(field) {
      if (!field[1]) return;

      const card = document.createElement("div");
      card.className = "detail-card";

      addText(card, "small", field[0]);
      addText(card, "strong", field[1]);

      details.appendChild(card);
    });

    content.appendChild(details);

    const descriptionBox = document.createElement("section");
    descriptionBox.className = "description";

    addText(descriptionBox, "h2", "About This Project");

    addText(
      descriptionBox,
      "p",
      project.description || "Contact us for more information."
    );

    content.appendChild(descriptionBox);

    const galleryImages = [
      ...(project.cover_image ? [project.cover_image] : []),
      ...(Array.isArray(project.gallery) ? project.gallery : [])
    ];

    const uniqueImages = [...new Set(galleryImages.filter(Boolean))];

    if (uniqueImages.length) {

      addText(content, "h2", "Project Gallery");

      const gallery = document.createElement("div");
      gallery.className = "gallery";

      uniqueImages.forEach(function(imageUrl) {

        const image = document.createElement("img");

        image.src = imageUrl;
        image.alt = project.project_name + " gallery image";
        image.loading = "lazy";

        gallery.appendChild(image);

      });

      content.appendChild(gallery);
    }

    const enquiry = document.createElement("a");

    enquiry.className = "btn";
    enquiry.textContent = "ENQUIRE ABOUT THIS PROJECT";

    enquiry.href =
      "https://wa.me/2347084125531?text=" +
      encodeURIComponent(
        "Hello VANTAGE X GROUP LTD. I am interested in " +
        project.project_name
      );

    enquiry.target = "_blank";
    enquiry.rel = "noopener noreferrer";

    content.appendChild(enquiry);

  } catch (error) {

    console.error(error);

    content.textContent =
      "We could not load this project. Please try again later.";

  }
}

loadProjectDetails();
</script>

</body>
</html>
